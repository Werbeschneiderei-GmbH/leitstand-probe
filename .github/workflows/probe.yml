# Probe der Anfrage-Kette (Leitstand der Werbeschneiderei, im OS spec/26).
# Schickt die echten Formulare der Pilot-Strecken mit der Probe-Adresse ab. Ob
# eine Probe durchkam, prüft healthchecks.io, nicht dieser Lauf: die
# Test-Weiche in n8n schickt ihre Mail an die Prüfung der Strecke. Bleibt sie
# aus, mailt healthchecks.io.
#
# Den Takt gibt n8n (Workflow „Leitstand - Proben-Takt“, 7:17 bis 22:17 Wiener
# Zeit) über die GitHub-Schnittstelle. Der eigene Zeitplan von GitHub ließ am
# 20.10.2026 einen Lauf ganz ausfallen, für eine Überwachung zu unzuverlässig.
#
# Warum ein eigenes, öffentliches Repo: Actions ist hier kostenlos und ohne
# Minutengrenze. Im OS-Repo hätte die Probe mit der CI die 2.000 Freiminuten
# gesprengt, und ohne Zahlungsart hält GitHub dann auch CI und Deploy an.

name: Probe

on:
  workflow_dispatch:
    inputs:
      strecken:
        description: "Nur diese Strecken, mit Leerzeichen getrennt (leer = alle)"
        required: false
        default: ""
      trocken:
        description: "Nur bis vor das Absenden, schickt nichts ab"
        type: boolean
        default: false

concurrency:
  group: probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browser vorinstalliert, Version gleich @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      # Eingaben über env, nie direkt in die Befehlszeile (Einschleusen).
      - run: node probe.mjs $TROCKEN $STRECKEN
        env:
          PROBE_TELEFON: ${{ secrets.PROBE_TELEFON }}
          PRUEFUNGEN: ${{ secrets.PRUEFUNGEN }}
          TROCKEN: ${{ inputs.trocken && '--trocken' || '' }}
          STRECKEN: ${{ inputs.strecken }}
